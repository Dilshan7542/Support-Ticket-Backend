spring:
  application:
    name: support-ticket-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/ticket_v1?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 1234
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jpa:
    hibernate:
     ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false
server:
  port: 8080

app:
  ai:
    mode: ${APP_AI_MODE:java}
    base-url: ${APP_AI_BASE_URL:http://localhost:5000}
  mail:
    from: ${APP_MAIL_FROM:no-reply@aiticket.local}
  attachment:
    storage-path: ${APP_ATTACHMENT_STORAGE_PATH:D:/support-ticket-attachments}
    max-file-size-bytes: ${APP_ATTACHMENT_MAX_FILE_SIZE_BYTES:10485760}
  jwt:
    access-token-expiration-minutes: ${APP_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:2880}
    refresh-token-expiration-minutes: ${APP_JWT_REFRESH_TOKEN_EXPIRATION_MINUTES:1440}
    secret: ${APP_JWT_SECRET:change-this-secret-value-in-production-minimum-32-chars}
  crypto:
    enabled: false
    excluded-paths: /actuator/**,/api/v1/health/status,/h2-console/**,/api/v1/tickets/upload-attachment,/api/v1/tickets/attachments/download
    secret-key: ${APP_CRYPTO_SECRET_KEY:12345678901234567890123456789012}

logging:
  config: classpath:log4j2-spring.xml
